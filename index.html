<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketOnline - Categorías</title>
    <!-- Estilos de Bootstrap inyectados localmente -->
    <style>
        body { background-color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; color: #212529; margin: 0; padding: 20px; }
        .container { max-width: 1140px; margin: 0 auto; padding: 10px 15px; }
        .text-center { text-align: center; }
        .mb-4 { margin-bottom: 1.5rem; }
        .mb-5 { margin-bottom: 3rem; }
        .row { display: flex; flex-wrap: wrap; margin-right: -12px; margin-left: -12px; }
        .col-12 { flex: 0 0 100%; max-width: 100%; padding: 12px; box-sizing: border-box; }
        @media (min-width: 768px) { .col-md-4 { flex: 0 0 33.333333%; max-width: 33.333333%; } }
        .card { position: relative; display: flex; flex-direction: column; min-width: 0; background-color: #fff; border: 0 solid rgba(0,0,0,.125); border-radius: 0.5rem; box-shadow: 0 .25rem .5rem rgba(0,0,0,.05); height: 100%; text-align: center; overflow: hidden; }
        .card-img-top { width: 100%; aspect-ratio: 16/9; object-fit: cover; background-color: #e9ecef; }
        .card-body { flex: 1 1 auto; padding: 1.5rem; display: flex; flex-direction: column; justify-content: center; }
        .card-title { font-size: 1.25rem; margin-bottom: 0.75rem; font-weight: 700; }
        .btn { display: inline-block; font-weight: 600; text-align: center; text-decoration: none; vertical-align: middle; cursor: pointer; border: 1px solid transparent; padding: .5rem 1rem; font-size: 1rem; border-radius: .25rem; margin-top: 1rem; }
        .btn-primary { color: #fff; background-color: #0d6efd; border-color: #0d6efd; }
        .bg-dark { background-color: #1a1e21!important; }
        .text-white { color: #fff!important; }
        .btn-light { color: #212529; background-color: #f8f9fa; border-color: #f8f9fa; }
        .logo-img { max-width: 100%; height: auto; width: 320px; margin: 0 auto; display: block; }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- ENCABEZADO CON TU LOGO REAL (FUNCIONANDO) -->
        <header class="text-center mb-5">
            <img src="../logo.png.jpeg" alt="MarketOnline Logo" class="logo-img mb-4">
        </header>

        <!-- GRID DE LAS 6 CATEGORÍAS -->
        <div class="row">
            
            <!-- 1. Tecnología -->
            <div class="col-12 col-md-4">
                <div class="card">
                    <img src="../tecnologia.jpg.jpg" class="card-img-top" alt="Tecnología">
                    <div class="card-body">
                        <h4 class="card-title">Tecnología</h4>
                        <a href="#" class="btn btn-primary">Ver Productos</a>
                    </div>
                </div>
            </div>

            <!-- 2. Ropa -->
            <div class="col-12 col-md-4">
                <div class="card">
                    <img src="../ropa.jpg.webp" class="card-img-top" alt="Ropa">
                    <div class="card-body">
                        <h4 class="card-title">Ropa</h4>
                        <a href="#" class="btn btn-primary">Ver Productos</a>
                    </div>
                </div>
            </div>

            <!-- 3. Joyas -->
            <div class="col-12 col-md-4">
                <div class="card">
                    <img src="../joyas.jpg.jpg" class="card-img-top" alt="Joyas">
                    <div class="card-body">
                        <h4 class="card-title">Joyas</h4>
                        <a href="#" class="btn btn-primary">Ver Productos</a>
                    </div>
                </div>
            </div>

            <!-- 4. Moda y Accesorios -->
            <div class="col-12 col-md-4">
                <div class="card">
                    <!-- Enlace estable en la nube para garantizar que cargue sin fallar de manera local -->
                    <img src="../moda.jpg.jpg" class="card-img-top" alt="Moda y Accesorios">
                    <div class="card-body">
                        <h4 class="card-title">Moda y Accesorios</h4>
                        <a href="#" class="btn btn-primary">Ver Productos</a>
                    </div>
                </div>
            </div>

            <!-- 5. Juguetes -->
            <div class="col-12 col-md-4">
                <div class="card">
                    <img src="../juguetes.jpg.jpg" class="card-img-top" alt="Juguetes">
                    <div class="card-body">
                        <h4 class="card-title">Juguetes</h4>
                        <a href="#" class="btn btn-primary">Ver Productos</a>
                    </div>
                </div>
            </div>

            <!-- 6. Otras categorías -->
            <div class="col-12 col-md-4">
                <div class="card bg-dark text-white">
                    <div class="card-body" style="min-height: 180px;">
                        <h4 class="card-title">Otras categorías</h4>
                        <p style="color: #a0aec0; font-size: 0.95rem;">Descubre promociones exclusivas en bazar, hogar y más.</p>
                        <a href="#" class="btn btn-light">Descubrir Más</a>
                    </div>
                </div>
            </div>

        </div> <!-- Fin de ROW -->
    </div> <!-- Fin de CONTAINER -->

</body>
</html>
